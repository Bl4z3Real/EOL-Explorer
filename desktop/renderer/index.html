<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: http: https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>EOL Explorer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="title">
    <img src="icon.png" alt="" width="20" height="20">
    <span id="ttl">EOL Explorer</span>
  </div>

  <div id="menubar"></div>
  <div id="tabs"></div>

  <div id="bar">
    <button class="btn flat nb" id="back"><b>◄</b><small id="backL"></small></button>
    <button class="btn flat nb" id="fwd"><b>►</b><small id="fwdL"></small></button>
    <button class="btn flat nb" id="stop"><b>✖</b><small id="stopL"></small></button>
    <button class="btn flat nb" id="reload"><b>↻</b><small id="reloadL"></small></button>
    <button class="btn flat nb" id="homeBtn"><b>🏠</b><small id="homeL"></small></button>
    <button class="btn flat nb" id="panelBtn"><b>⭐</b><small id="panelL"></small></button>
    <div class="sep"></div>
    <form id="addr" autocomplete="off">
      <input id="url" class="sunk" type="text" spellcheck="false">
      <button class="btn" type="submit" id="goBtn"></button>
    </form>
    <form id="sbox" autocomplete="off">
      <input id="sq" class="sunk" type="text">
      <button class="btn flat" type="submit" id="sqBtn">🔍</button>
    </form>
    <div id="throb" class="raised"><span>🌐</span></div>
  </div>

  <div id="main">
    <div id="rail">
      <button class="btn rb c1" data-p="fav" id="railFav"></button>
      <button class="btn rb c2" data-p="hist" id="railHist"></button>
      <button class="btn rb c3" data-p="chan" id="railChan"></button>
    </div>
    <div id="panel">
      <div id="phead"><span id="ptitle"></span><button class="btn tb" id="pclose">✕</button></div>
      <div id="pbody" class="sunk"></div>
    </div>
    <div id="viewcol" class="sunk">
      <div id="find">
        <label for="fq" id="findLabel"></label>
        <input id="fq" class="sunk" type="text">
        <span id="fcount"></span>
        <button class="btn" id="fprev">▲</button>
        <button class="btn" id="fnext">▼</button>
        <button class="btn" id="fclose">✕</button>
      </div>
      <div id="stage">
        <div id="err">
          <div class="dlgbox raised">
            <div class="dt" id="errTitle"></div>
            <div class="db"><p id="errmsg"></p><p id="errurl"></p></div>
            <div class="df"><button class="btn" id="errretry"></button><button class="btn" id="errhome"></button></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="status">
    <div id="stat"></div>
    <div id="zoomst">100%</div>
    <div id="sec"></div>
    <div id="clock">--:--</div>
  </div>
</div>

<div id="pop" class="raised"></div>

<template id="homeTpl">
<div id="home">
  <div class="h-head">
    <div class="h-logo"><img src="icon.png" alt="" width="52" height="52"><span>EOL<i>Explorer</i></span></div>
    <div class="h-search">
      <div class="h-cats" id="cats"></div>
      <form id="hform" autocomplete="off">
        <input id="hq" type="text">
        <button class="btn" type="submit" id="hSearchBtn"></button>
      </form>
    </div>
  </div>
  <div class="h-body">
    <div class="h-main">
      <h1 id="greet">Buongiorno</h1>
      <div id="hdate"></div>
      <div class="h-tabs" id="htabs"></div>
      <div class="h-panel sunk" id="htiles"></div>
      <div class="h-hero">
        <h2 id="heroTitle"></h2>
        <p id="heroText"></p>
        <button class="btn" id="tmBtn"></button>
      </div>
    </div>
    <aside class="h-side">
      <div class="box raised"><h3 id="lcdTimeLbl"></h3><div class="lcd" id="lcd">00:00:00</div></div>
      <div class="box raised"><h3 id="lcdVisitsLbl"></h3><div class="lcd" id="visits">000000</div></div>
      <div class="box raised"><h3 id="favsLbl"></h3><div id="hfavs"></div></div>
    </aside>
  </div>
  <div class="h-mar"><span id="marquee"></span></div>
</div>
</template>

<script src="strings.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
